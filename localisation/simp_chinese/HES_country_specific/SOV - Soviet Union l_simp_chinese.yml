SOV_stalin: "约瑟夫·斯大林"
SOV_stalin_leader_desc: "§Y苏联共产党中央委员会总书记§!\n\n斯大林和列宁在一起领导十月社会主义革命，缔造了世界上第一个社会主义国家。在列宁逝世之后，斯大林继承马克思、恩格斯、列宁的事业，对敌人和叛徒进行了无情的斗争，领导了苏联人民胜利地建设了社会主义社会，并在胜利地进行大规模的共产主义建设。在第二次世界大战时期，斯大林指挥苏联军队战胜了德、意、日法西斯强盗，从而拯救了人类免于法西斯的奴役。全世界和平爱好者的力量，在斯大林的光荣旗帜下团结了起来，在战后为争取持久和平和人民民主而进行着英勇的斗争。"
